name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore coverage tool
        shell: pwsh
        run: dotnet tool restore
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          $scanner = Join-Path $env:RUNNER_TEMP 'scanner/dotnet-sonarscanner.exe'
          & $scanner begin /k:samfarls55_freehand /o:samfarls55 "/d:sonar.token=$env:SONAR_TOKEN" /d:sonar.cs.vscoveragexml.reportsPaths=artifacts/coverage/dotnet*.xml /d:sonar.coverageReportPaths=artifacts/coverage/scripts.xml /d:sonar.test.inclusions=tests/**
          if ($LASTEXITCODE -ne 0) { throw 'SonarQube initialization failed.' }
          dotnet build Freehand.sln -c Release --no-incremental
          if ($LASTEXITCODE -ne 0) { throw 'Analysis build failed.' }
          dotnet tool run dotnet-coverage collect 'dotnet test Freehand.sln -c Release --no-build' -f xml -o artifacts/coverage/dotnet.xml
          if ($LASTEXITCODE -ne 0) { throw 'Coverage test run failed.' }
          # Exercise the real speech worker and replay assertions under coverage.
          # The profiler needs managed assemblies on disk rather than inside a bundle.
          ./scripts/build-release.ps1 -Dotnet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { throw 'Coverage package build failed.' }
          dotnet publish src/Freehand.App/Freehand.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false --output artifacts/coverage-app
          if ($LASTEXITCODE -ne 0) { throw 'Coverage application publish failed.' }
          Copy-Item -LiteralPath artifacts/publish/models -Destination artifacts/coverage-app -Recurse -Force
          Copy-Item -LiteralPath artifacts/publish/fixtures -Destination artifacts/coverage-app -Recurse -Force
          . ./scripts/common.ps1
          $identity = Get-Content -LiteralPath artifacts/publish/package-manifest.json -Raw | ConvertFrom-Json
          New-FreehandPackageManifest -Directory (Join-Path $PWD 'artifacts/coverage-app') -Version $identity.Version -Build $identity.Build
          $updateCommand = 'pwsh -NoProfile -File ./tests/Freehand.Scripts.Tests/Run.ps1 -PackageIntegration -PublishDirectory ./artifacts/coverage-app'
          dotnet tool run dotnet-coverage collect $updateCommand -f xml -o artifacts/coverage/dotnet-updates.xml
          if ($LASTEXITCODE -ne 0) { throw 'Covered update verification failed.' }
          $performanceApp = (Resolve-Path artifacts/coverage-app/Freehand.App.exe).Path
          $performanceOutput = Join-Path $PWD 'artifacts/coverage/performance.json'
          $performanceCommand = '"{0}" --performance-check "{1}"' -f $performanceApp, $performanceOutput
          dotnet tool run dotnet-coverage collect $performanceCommand -f xml -o artifacts/coverage/dotnet-performance.xml
          if ($LASTEXITCODE -ne 0) { throw 'Covered performance replay failed.' }
          & $scanner end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw 'SonarQube upload failed.' }
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage
          if-no-files-found: warn
