name: Windows

# Build, test, publish, and smoke-test the Windows application.

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, analyze & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore
        run: dotnet restore Freehand.sln

      # --no-incremental is REQUIRED, not tidiness: Roslyn analyzer warnings are not
      # re-emitted on an incremental build, so -warnaserror would pass on cached results
      # and the whole gate would be theatre.
      - name: Build (warnings are errors)
        run: >
          dotnet build Freehand.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror
          -bl:artifacts/build.binlog

      - name: Test
        run: >
          dotnet test Freehand.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Package the complete application
        shell: pwsh
        run: ./scripts/build-release.ps1 -Dotnet (Get-Command dotnet).Source

      # Run the packaged executable with its platform assembly, native dependencies,
      # pinned model, and speech fixture. A lone executable is not a complete install.
      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/Freehand.App.exe'
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          # Start-Process -Wait, not '&': this is a WinExe, so the console does not block on
          # it and $LASTEXITCODE would be whatever ran before.
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -WindowStyle Hidden
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }

      - name: Upload the installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Freehand-win-x64
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          # 'warn', not 'error': when the build fails before tests run there are no results,
          # and a second red step there only obscures the real failure.
          if-no-files-found: warn

      # Keep the build log when a CI failure needs investigation.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: artifacts/build.binlog
          if-no-files-found: ignore
