name: Windows

# Build, test, publish, and smoke-test the Windows application.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, analyze & test
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read version and validate release tag
        id: version
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $version = Get-FreehandVersion
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'The release tag must match Version.props.' }
            if (-not (Test-Path -LiteralPath "packaging/release-notes/$version.md")) { throw 'Release notes are required for this version.' }
          }

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Build, test, package, and verify the published application
        shell: pwsh
        run: ./scripts/verify.ps1 -Dotnet (Get-Command dotnet).Source -Package

      - name: Upload the installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Freehand-win-x64
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          # 'warn', not 'error': when the build fails before tests run there are no results,
          # and a second red step there only obscures the real failure.
          if-no-files-found: warn

      # Keep the build log when a CI failure needs investigation.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: artifacts/build.binlog
          if-no-files-found: ignore

  release:
    name: Publish the tagged installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Freehand-win-x64
          path: artifacts/release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-test.outputs.version }}
        run: |
          $installer = "artifacts/release/Freehand-$($env:RELEASE_VERSION)-win-x64-Setup.exe"
          gh release create $env:RELEASE_TAG $installer ($installer + '.sha256') --verify-tag --title "Freehand $($env:RELEASE_VERSION)" --notes-file "packaging/release-notes/$($env:RELEASE_VERSION).md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
