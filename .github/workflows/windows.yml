name: Windows

# Build, test, publish, and smoke-test the Windows application.

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'shared/**', 'packaging/**', 'scripts/**', '*.props', '*.sln', '*.slnf', 'global.json', '.github/workflows/windows.yml']
  workflow_dispatch:

# Keep version allocation, verification, and publication in order. PRs stay independent.
concurrency:
  group: windows-${{ github.ref == 'refs/heads/main' && 'release' || github.run_id }}
  queue: max

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, analyze & test
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Select the package version
        id: version
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $version = if ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -ne 'pull_request') {
            ./scripts/release-version.ps1
          } else { Get-FreehandVersion }
          "version=$version" >> $env:GITHUB_OUTPUT
          "FREEHAND_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Build, test, package, and verify the published application
        shell: pwsh
        run: ./scripts/verify.ps1 -Dotnet (Get-Command dotnet).Source -Package

      - name: Upload the installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Freehand-win-x64
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Verify isolated upgrade and rollback
        shell: pwsh
        run: ./scripts/verify-updates.ps1

      - name: Verify deployment and release scripts
        shell: pwsh
        run: ./tests/Freehand.Scripts.Tests/Run.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          # 'warn', not 'error': when the build fails before tests run there are no results,
          # and a second red step there only obscures the real failure.
          if-no-files-found: warn

      # Keep the build log when a CI failure needs investigation.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: artifacts/build.binlog
          if-no-files-found: ignore

  release:
    name: Publish the verified installer
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Freehand-win-x64
          path: artifacts/release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-test.outputs.version }}
        run: |
          ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA
