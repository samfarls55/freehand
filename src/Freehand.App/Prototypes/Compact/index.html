<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Freehand · Compact prototype</title>
  <style>
    :root { color-scheme: dark; --desk:#111314; --surface:#1c1f20; --raised:#252a2a; --line:#343a39; --ink:#f1f3f2; --muted:#afb6b3; --accent:#b5c9bc; --accent-ink:#18231c; --record:#f45b55; --amber:#e3bd7b; --dock-height:112px; font:15px/1.5 "Segoe UI Variable", "Segoe UI", sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--desk); color:var(--ink); padding-bottom:calc(var(--dock-height) + 24px); }
    button,input,select,textarea { font:inherit; color:inherit; }
    button,summary,select { cursor:pointer; }
    button { border:0; background:transparent; padding:9px 13px; border-radius:7px; line-height:1.25; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    button:hover,summary:hover { background:#ffffff09; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex="0"]:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    input,textarea { caret-color:var(--accent); }
    ::selection { background:#b5c9bc40; color:#fff; }
    [hidden] { display:none !important; }
    svg { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    .workspace { position:relative; max-width:1112px; height:calc(100dvh - var(--dock-height) - 48px); min-height:460px; margin:24px auto 0; }
    .app-window { height:100%; background:var(--surface); border-radius:12px; box-shadow:0 20px 60px #0005; display:flex; flex-direction:column; overflow:hidden; position:relative; z-index:1; }
    .workspace.expanded { max-width:calc(100% - 32px); }
    .titlebar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:60px; padding-left:24px; border-bottom:1px solid var(--line); flex:none; }
    .brand { display:flex; align-items:center; gap:12px; font-size:17px; font-weight:500; letter-spacing:-.02em; }
    .brand svg { width:23px; height:23px; }
    .tabs { display:flex; gap:22px; height:60px; }
    .tab { position:relative; padding:0 3px; border-radius:0; font-size:14px; color:var(--muted); }
    .tab:hover { background:transparent; color:var(--ink); }
    .tab[aria-selected="true"] { color:var(--ink); font-weight:600; }
    .tab[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--accent); border-radius:2px 2px 0 0; }
    .window-actions { justify-self:end; display:flex; align-self:start; }
    .window-actions button { width:42px; height:38px; padding:0; border-radius:0; }
    .window-actions svg { width:15px; height:15px; }
    .content { flex:1; overflow:auto; padding:32px 44px 88px; scrollbar-width:thin; scrollbar-color:#535b57 transparent; }
    .page-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:30px; line-height:1.2; font-weight:550; letter-spacing:-.025em; text-wrap:balance; }
    h2 { margin:0 0 8px; font-size:15px; font-weight:600; }
    p { margin:0; }
    .search { display:flex; align-items:center; gap:11px; background:#ffffff03; border:1px solid #424947; border-radius:7px; padding:0 13px; height:43px; margin-bottom:23px; }
    .search svg { color:var(--muted); }
    .search input { background:none; border:0; padding:9px 0; min-width:0; width:100%; outline:none; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .search input:focus-visible { outline:0; }
    ::placeholder { color:var(--muted); opacity:1; }
    .search button { padding:4px; color:var(--muted); }
    .search button svg { width:16px; height:16px; }
    .transcript { position:relative; padding:22px 10px 25px; border-bottom:1px solid var(--line); border-radius:0; }
    .transcript:last-child { border-bottom:0; }
    .timestamp { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; margin-bottom:10px; display:block; }
    .transcript-body { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:22px; align-items:start; }
    .transcript p { font-size:16px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; max-width:74ch; }
    .row-actions { display:flex; gap:8px; opacity:0; pointer-events:none; }
    .transcript.selected .row-actions,.transcript:hover .row-actions,.transcript:focus-within .row-actions { opacity:1; pointer-events:auto; }
    .copy-button { background:#b5c9bc16; color:#eef4f0; min-height:36px; }
    .copy-button:hover { background:#b5c9bc27; }
    .copy-button svg { width:17px; height:17px; }
    .row-menu { position:relative; }
    .row-menu summary { display:flex; align-items:center; justify-content:center; width:34px; height:36px; border-radius:7px; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    .row-menu[open] { z-index:3; }
    .menu { position:absolute; right:0; top:42px; background:#303635; border-radius:9px; padding:5px; box-shadow:0 9px 26px #0006; min-width:150px; }
    .menu button { width:100%; justify-content:flex-start; white-space:nowrap; }
    .primary { background:var(--accent); color:var(--accent-ink); font-weight:600; min-height:37px; }
    .primary:hover { background:#cadbcf; }
    .secondary { background:#ffffff08; }
    .subtle { color:var(--muted); }
    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; min-height:225px; color:var(--muted); }
    .empty p { font-size:17px; }
    .load-more { display:flex; justify-content:center; margin-top:16px; }
    .section-label { font-size:12px; font-weight:500; color:var(--muted); margin:28px 0 2px; }
    .dict-row { display:grid; grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) auto; align-items:center; gap:14px; min-height:70px; border-bottom:1px solid var(--line); padding:12px 4px; }
    .dict-row .phrase { overflow-wrap:anywhere; }
    .dict-row.disabled .phrase,.dict-row.disabled .pair-arrow { color:#a0a6a3; }
    .pair-arrow { color:var(--muted); width:17px; }
    .dict-actions { display:flex; align-items:center; gap:9px; }
    .icon-button { width:32px; height:32px; padding:0; color:var(--muted); }
    .icon-button svg { width:17px; height:17px; }
    .switch { background:#5a625f; width:34px; min-width:34px; height:20px; border-radius:12px; padding:3px; display:block; position:relative; }
    .switch::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; background:#f1f3f2; border-radius:50%; transition:transform .15s ease-out; }
    .switch[aria-checked="true"] { background:var(--accent); }
    .switch[aria-checked="true"]::after { background:#22372a; transform:translateX(14px); }
    .switch:hover { filter:brightness(1.1); }
    .editor { border-bottom:1px solid var(--line); padding:3px 0 26px; margin-bottom:26px; }
    .editor-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .editor h2 { margin:0; font-size:17px; }
    .segmented { display:inline-flex; gap:3px; padding:3px; border-radius:8px; background:#121515; margin-bottom:21px; }
    .segmented button { color:var(--muted); padding:7px 12px; font-size:13px; }
    .segmented button[aria-pressed="true"] { background:#333b37; color:var(--ink); }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .field { display:flex; flex-direction:column; gap:8px; min-width:0; font-size:13px; }
    .field input { background:#151819; border:1px solid #505854; border-radius:6px; width:100%; padding:10px 12px; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:21px; }
    .validation { font-size:13px; color:var(--amber); margin-top:12px; }
    .settings-group { margin-top:26px; }
    .settings-group:first-of-type { margin-top:2px; }
    .setting-row { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:19px 2px; border-bottom:1px solid var(--line); }
    .setting-row > label { cursor:pointer; }
    select { background:#2a302e; border:1px solid #4c5550; border-radius:6px; padding:7px 31px 7px 11px; max-width:100%; font-size:13px; }
    .model-details { margin-top:28px; }
    .model-details > summary { display:flex; align-items:center; gap:12px; padding:14px 2px; color:var(--muted); border-radius:4px; list-style:none; }
    .model-details > summary svg { width:15px; transition:transform .15s ease-out; }
    .model-details[open] > summary svg { transform:rotate(90deg); }
    .model-details .model-state { margin-left:auto; font-size:13px; color:var(--accent); }
    .model-body { padding:0 22px 16px; }
    .model-body .setting-row { color:var(--muted); font-size:13px; padding:12px 0; }
    .model-body button { margin-top:16px; }
    .notice { display:flex; align-items:center; gap:14px; padding:13px 16px; margin-bottom:24px; background:#e3bd7b0c; border-radius:8px; color:var(--amber); }
    .notice p { flex:1; font-size:14px; }
    .notice-content { flex:1; min-width:0; }
    .notice .notice-transcript { margin-top:8px; color:var(--ink); font-size:15px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .notice .notice-actions { display:flex; gap:5px; flex:none; }
    .notice button { color:var(--ink); font-size:13px; background:#ffffff08; }
    .notice > svg { width:19px; }
    .deferred { color:var(--amber); font-size:13px; margin-bottom:18px; }
    .receiving { position:absolute; inset:8% 8%; display:flex; align-items:center; justify-content:center; }
    .receiving-panel { width:min(650px,100%); }
    .receiving header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .receiving h2 { font-size:18px; font-weight:500; margin:0; }
    .receiving textarea { resize:vertical; width:100%; min-height:260px; border:1px solid var(--line); background:#191d1d; padding:25px; border-radius:9px; font-size:17px; line-height:1.7; }
    .tray-label { display:flex; align-items:center; gap:9px; margin-top:17px; color:var(--muted); font-size:13px; }
    .tray-label svg { width:16px; }
    .pill { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--dock-height) + 28px); min-height:54px; padding:0 20px; border-radius:28px; background:#272c2b; box-shadow:0 8px 30px #0005; display:flex; align-items:center; gap:15px; z-index:5; white-space:nowrap; font-size:14px; }
    .record-dot { width:10px; height:10px; flex:none; background:var(--record); border-radius:50%; }
    .pill[data-state="awaiting-retry"] .record-dot,.pill[data-state="insertion-failure"] .record-dot,.pill[data-state="microphone-failure"] .record-dot,.pill[data-state="empty"] .record-dot { background:var(--amber); }
    .pill:not([data-state="recording"]) .record-dot { background:var(--accent); }
    .pill[data-state="awaiting-retry"] .record-dot,.pill[data-state="insertion-failure"] .record-dot,.pill[data-state="microphone-failure"] .record-dot,.pill[data-state="empty"] .record-dot { background:var(--amber); }
    .waves { display:flex; align-items:center; gap:3px; width:54px; height:25px; }
    .waves i { display:block; width:3px; border-radius:3px; height:var(--h); background:var(--ink); animation:wave .7s ease-in-out var(--delay) infinite alternate; }
    .pill:not([data-state="recording"]) .waves { width:20px; gap:3px; }
    .pill:not([data-state="recording"]) .waves i { width:4px; height:4px; animation:processing 1s ease-in-out var(--delay) infinite; }
    .pill:not([data-state="recording"]) .waves i:nth-child(n+4) { display:none; }
    .pill[data-state="success"] .waves,.pill[data-state="awaiting-retry"] .waves,.pill[data-state="insertion-failure"] .waves,.pill[data-state="microphone-failure"] .waves,.pill[data-state="empty"] .waves { display:none; }
    .pill-time { font-variant-numeric:tabular-nums; padding-left:15px; border-left:1px solid #515954; min-width:54px; }
    .pill button { background:#ffffff0b; padding:7px 10px; font-size:12px; }
    @keyframes wave { to { transform:scaleY(.35); } }
    @keyframes processing { 50% { opacity:.3; } }
    .toast { position:fixed; top:84px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:19px; z-index:8; border-radius:9px; background:#3d4941; padding:11px 15px; box-shadow:0 8px 25px #0005; font-size:13px; max-width:calc(100% - 30px); }
    .toast button { padding:4px 6px; text-decoration:underline; text-underline-offset:3px; }
    .demo-dock { position:fixed; bottom:0; left:0; right:0; background:#121615; border-top:1px solid #3b443f; padding:13px max(22px,calc((100vw - 1056px)/2)) 15px; z-index:10; font-size:12px; }
    .demo-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; color:var(--muted); margin-bottom:10px; }
    .demo-heading strong { font-weight:600; color:#e4eae6; margin-right:10px; }
    .demo-heading button { padding:1px 3px; font-size:12px; color:var(--muted); }
    .demo-heading button svg { width:13px; height:13px; }
    .demo-controls { display:flex; align-items:center; gap:13px; }
    .demo-controls button { min-height:35px; font-size:13px; }
    .demo-controls .record-button { background:#e1e9e3; color:#1c2520; font-weight:600; min-width:154px; }
    .record-button svg { width:16px; height:16px; }
    .demo-controls label { display:flex; align-items:center; gap:9px; color:var(--muted); }
    .demo-state { color:var(--accent); font-variant-numeric:tabular-nums; min-width:85px; }
    .demo-controls .window-toggle { margin-left:auto; background:#ffffff08; }
    .sample-input { position:relative; }
    .sample-input summary { padding:8px 7px; list-style:none; border-radius:5px; white-space:nowrap; color:var(--muted); font-size:13px; }
    .sample-input[open] .sample-popover { display:block; }
    .sample-popover { position:absolute; right:0; bottom:43px; width:min(380px,80vw); padding:16px; border-radius:10px; box-shadow:0 12px 40px #0007; background:#2c3430; }
    .sample-popover label { display:block; margin-bottom:9px; color:var(--ink); }
    .sample-popover textarea { display:block; width:100%; min-height:120px; padding:10px; resize:vertical; background:#1b211e; border:1px solid #6b786e; border-radius:5px; font-size:14px; line-height:1.5; }
    @media (max-width:1150px) { .workspace { margin-left:22px; margin-right:22px; } .demo-controls { gap:10px; } .demo-state { min-width:65px; } }
    @media (max-width:850px) { .content { padding:26px 26px 80px; } .titlebar { padding-left:20px; grid-template-columns:auto 1fr auto; gap:20px; } .tabs { justify-self:center; gap:18px; } .window-actions button { width:30px; } .window-actions button[data-action="expand"] { display:none; } .transcript-body { gap:12px; } .row-actions { opacity:1; pointer-events:auto; } .copy-button .copy-label { display:none; } .copy-button { padding:8px; } .demo-heading { margin-bottom:8px; } .demo-controls { flex-wrap:wrap; } .demo-state { min-width:70px; } .demo-controls label { margin-left:auto; } .demo-controls .window-toggle { margin-left:0; } .workspace { min-height:420px; } }
    @media (max-width:560px) { .workspace { margin:10px 10px 0; height:calc(100dvh - var(--dock-height) - 28px); min-height:380px; } .titlebar { padding:0 16px; gap:12px; grid-template-columns:auto 1fr; min-height:55px; } .brand { font-size:15px; gap:7px; } .brand svg { width:18px; } .tabs { gap:13px; height:55px; justify-self:end; } .tab { font-size:12px; } .window-actions { display:none; } .content { padding:24px 19px 75px; } h1 { font-size:26px; } .transcript { padding-left:2px; padding-right:2px; } .transcript p { font-size:15px; } .transcript-body { grid-template-columns:1fr; gap:12px; } .row-actions { justify-self:end; } .copy-button .copy-label { display:inline; } .dict-row { grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr); gap:8px; } .dict-actions { grid-column:1/-1; justify-content:flex-end; } .fields { grid-template-columns:1fr; } .setting-row { font-size:14px; gap:12px; } .setting-row select { max-width:145px; } .notice { flex-wrap:wrap; } .notice .notice-actions { margin-left:auto; } .demo-dock { padding:10px 15px 12px; } .demo-heading { font-size:10px; gap:8px; } .demo-heading strong { margin-right:6px; } .demo-controls label { font-size:0; } .demo-controls select { max-width:155px; font-size:12px; } .demo-controls .record-button { min-width:145px; } .demo-state { min-width:45px; } .pill { gap:10px; padding:0 15px; max-width:calc(100% - 20px); font-size:12px; } .pill .waves { width:43px; gap:2px; } .pill-time { padding-left:10px; } .receiving { inset:4%; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-16v20m5-16v12m4-8v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="7" width="12" height="14" rx="2"/><path d="M15 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-5-5L4 14Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="m12 3 10 18H2Zm0 5v5m0 4v.1"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </defs></svg>

  <div class="workspace" id="workspace">
    <section class="receiving" aria-label="Simulated foreground application">
      <div class="receiving-panel">
        <header><h2><label for="receiving-text">Text field</label></h2><button class="subtle" data-action="clear-target">Clear</button></header>
        <textarea id="receiving-text" placeholder="Dictation appears here" spellcheck="false"></textarea>
        <p class="tray-label"><svg aria-hidden="true"><use href="#i-wave"/></svg>Freehand is in the tray<button class="subtle" data-action="show-window">Open Freehand</button></p>
      </div>
    </section>
    <section class="app-window" id="app-window" aria-label="Freehand prototype window">
      <header class="titlebar">
        <div class="brand"><svg aria-hidden="true"><use href="#i-wave"/></svg>Freehand</div>
        <nav class="tabs" role="tablist" aria-label="Freehand">
          <button class="tab" id="tab-history" role="tab" aria-selected="true" aria-controls="content" data-view="history">History</button>
          <button class="tab" id="tab-dictionary" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-view="dictionary">Dictionary</button>
          <button class="tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-view="settings">Settings</button>
        </nav>
        <div class="window-actions">
          <button aria-label="Minimize window" data-action="hide-window"><svg aria-hidden="true"><use href="#i-minimize"/></svg></button>
          <button aria-label="Expand window" aria-pressed="false" data-action="expand"><svg aria-hidden="true"><use href="#i-maximize"/></svg></button>
          <button aria-label="Close to tray" data-action="hide-window"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
      </header>
      <main class="content" id="content" role="tabpanel" aria-labelledby="tab-history" tabindex="-1"></main>
    </section>
  </div>

  <div class="pill" id="pill" hidden>
    <span class="record-dot" aria-hidden="true"></span>
    <span class="waves" aria-hidden="true"><i style="--h:7px;--delay:-.1s"></i><i style="--h:14px;--delay:-.3s"></i><i style="--h:23px;--delay:-.5s"></i><i style="--h:16px;--delay:-.2s"></i><i style="--h:10px;--delay:-.4s"></i><i style="--h:20px;--delay:-.6s"></i><i style="--h:8px;--delay:-.3s"></i><i style="--h:13px;--delay:-.1s"></i><i style="--h:6px;--delay:-.5s"></i></span>
    <span id="pill-label"></span><span class="pill-time" id="pill-time" hidden>00:00</span><span id="pill-actions"></span>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <footer class="demo-dock" aria-label="Prototype controls">
    <div class="demo-heading"><span><strong>Compact prototype</strong>Sample data · Simulated dictation</span><button data-action="reset"><svg aria-hidden="true"><use href="#i-reset"/></svg>Reset demo</button></div>
    <div class="demo-controls">
      <button class="record-button" id="record-button" data-action="record"><svg aria-hidden="true"><use href="#i-mic"/></svg><span>Start dictation</span></button>
      <span class="demo-state" id="demo-state" aria-live="polite">Ready</span>
      <label for="scenario">Outcome<select id="scenario"><option value="success">Success</option><option value="transcription-failure">Transcription fails</option><option value="insertion-failure">Insertion fails</option><option value="empty">No speech</option><option value="microphone-failure">Microphone unavailable</option></select></label>
      <details class="sample-input"><summary>Sample text</summary><div class="sample-popover"><label for="sample-text">Next transcript</label><textarea id="sample-text" spellcheck="false">Use free hand to finish this note. Keep the next step simple.</textarea></div></details>
      <button class="window-toggle" id="window-toggle" data-action="toggle-window">Hide Freehand</button>
    </div>
  </footer>

  <script>
    // Throwaway prototype of the approved Compact direction. All app data lives in memory.
    const $ = selector => document.querySelector(selector);
    const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const seedHistory = [
      {id:'h1',day:'Today',time:'10:42',text:'Keep the input device selected while recording. If the microphone disconnects, preserve the recording and offer Retry.'},
      {id:'h2',day:'Today',time:'10:18',text:'The settings change should take effect after the current recording finishes.'},
      {id:'h3',day:'Yesterday',time:'16:05',text:'Review the dictionary corrections before the next release.'},
      {id:'h4',day:'Yesterday',time:'14:32',text:'The next build should be easy to install and ready to use.'},
      {id:'h5',day:'Monday',time:'11:16',text:'A clear layout should make the controls easy to find.'},
      {id:'h6',day:'Monday',time:'09:48',text:'Keep the original recording available until the retry finishes.'}
    ];
    const seedDictionary = [
      {id:'d1',kind:'correction',hear:'free hand',write:'Freehand',enabled:true},
      {id:'d2',kind:'correction',hear:'cloud code',write:'Claude Code',enabled:true},
      {id:'d3',kind:'term',hear:'',write:'sherpa-onnx',enabled:true}
    ];
    const defaultSettings = {shortcut:'Right Ctrl',inject:true,history:true,startup:true,idle:'5'};
    let records, dictionary, settings, view='history', selected='h1', queries={history:'',dictionary:''}, visibleCount=3;
    let editor=null, state='ready', notice=null, lastResult='', pendingText='', jobSettings=null, jobOutcome='success';
    let serial=0, nextId=100, started=0, timer=null, toastTimer=null, pillTimer=null, undo=null;
    const labels = {ready:'Ready',recording:'Recording',preparing:'Preparing',transcribing:'Transcribing',recovering:'Recovering',inserting:'Inserting','awaiting-retry':'Recording kept',success:'Done','insertion-failure':'Copy transcript',empty:'No speech','microphone-failure':'Check microphone'};
    const busy = () => ['recording','preparing','transcribing','recovering','inserting'].includes(state);
    const later = (fn,ms) => { const token=serial; setTimeout(() => { if(token===serial) fn(); },ms); };
    const announce = text => { $('#announcer').textContent=text; };
    const button = (label,action,extra='') => `<button data-action="${action}" ${extra}>${label}</button>`;

    function searchBox(kind) {
      const label=kind==='history'?'Search history':'Search dictionary';
      return `<div class="search" role="search">${icon('search')}<input type="search" id="search-${kind}" aria-label="${label}" placeholder="${label}" value="${escape(queries[kind])}" autocomplete="off"><button data-action="clear-search" aria-label="Clear search" ${queries[kind]?'':'hidden'}>${icon('close')}</button></div>`;
    }
    function render() {
      document.querySelectorAll('[data-view]').forEach(tab => { const active=tab.dataset.view===view; tab.setAttribute('aria-selected',active); tab.tabIndex=active?0:-1; });
      $('#content').setAttribute('aria-labelledby',`tab-${view}`);
      if(view==='history') {
        $('#content').innerHTML=`<div id="notice-host"></div><div class="page-heading"><h1>History</h1></div>${searchBox('history')}<div id="history-list"></div>`;
        renderHistory();
      } else if(view==='dictionary') {
        $('#content').innerHTML=`<div id="notice-host"></div><div class="page-heading"><h1>Dictionary</h1><button class="primary" data-action="add-entry">${icon('plus')}Add entry</button></div>${searchBox('dictionary')}<div id="editor-host"></div><div id="dictionary-list"></div>`;
        renderEditor(); renderDictionary();
      } else renderSettings();
      renderNotice();
    }
    function renderHistory() {
      if(!$('#history-list')) return;
      const query=queries.history.trim().toLowerCase();
      const matches=records.filter(record => record.text.toLowerCase().includes(query));
      const shown=query?matches:matches.slice(0,visibleCount);
      if(!shown.length) {
        $('#history-list').innerHTML=`<div class="empty"><p>${query?'No matches':'No transcripts yet'}</p>${query?button('Clear search','clear-search'):button('Try dictation','record','class="secondary"')}</div>`;
      } else {
        $('#history-list').innerHTML=shown.map(record => `<article class="transcript ${selected===record.id?'selected':''}" tabindex="0" data-record="${record.id}" aria-label="Transcript ${record.day} at ${record.time}"><span class="timestamp">${escape(record.day)}&nbsp;&nbsp; ${escape(record.time)}</span><div class="transcript-body"><p>${escape(record.text)}</p><div class="row-actions"><button class="copy-button" data-action="copy" data-id="${record.id}" aria-label="Copy transcript at ${record.time}">${icon('copy')}<span class="copy-label">Copy</span></button><details class="row-menu"><summary aria-label="More actions for transcript at ${record.time}">${icon('more')}</summary><div class="menu">${button(icon('trash')+'Delete transcript','delete-record',`data-id="${record.id}"`)}</div></details></div></div></article>`).join('')+(matches.length>shown.length?`<div class="load-more">${button('Load earlier transcripts','load-more','class="subtle"')}</div>`:'');
      }
      searchClearVisibility();
    }
    function renderDictionary() {
      if(!$('#dictionary-list')) return;
      const query=queries.dictionary.trim().toLowerCase();
      const entries=dictionary.filter(entry => `${entry.hear} ${entry.write}`.toLowerCase().includes(query));
      $('#dictionary-list').innerHTML=entries.length?['correction','term'].map(kind => {
        const group=entries.filter(entry => entry.kind===kind);
        if(!group.length) return '';
        return `<h2 class="section-label">${kind==='correction'?'Corrections':'Reference terms'}</h2>`+group.map(entry => `<div class="dict-row ${entry.enabled?'':'disabled'}" data-entry="${entry.id}"><span class="phrase">${escape(kind==='correction'?entry.hear:entry.write)}</span>${kind==='correction'?icon('arrow').replace('<svg ','<svg class="pair-arrow" '):'<span></span>'}<span class="phrase">${kind==='correction'?escape(entry.write):''}</span><div class="dict-actions"><button class="switch" role="switch" aria-checked="${entry.enabled}" aria-label="Enable ${escape(entry.hear||entry.write)}" data-action="toggle-entry" data-id="${entry.id}"></button><button class="icon-button" aria-label="Edit ${escape(entry.hear||entry.write)}" data-action="edit-entry" data-id="${entry.id}">${icon('edit')}</button><button class="icon-button" aria-label="Delete ${escape(entry.hear||entry.write)}" data-action="delete-entry" data-id="${entry.id}">${icon('trash')}</button></div></div>`).join('');
      }).join(''):`<div class="empty"><p>${query?'No matches':'No dictionary entries'}</p>${button(query?'Clear search':'Add entry',query?'clear-search':'add-entry','class="secondary"')}</div>`;
      searchClearVisibility();
    }
    function renderEditor() {
      if(!$('#editor-host')) return;
      if(!editor) { $('#editor-host').innerHTML=''; return; }
      $('#editor-host').innerHTML=`<form class="editor" id="entry-form"><div class="editor-title"><h2>${editor.id?'Edit entry':'New entry'}</h2><button type="button" class="icon-button" data-action="cancel-entry" aria-label="Close editor">${icon('close')}</button></div><div class="segmented" role="group" aria-label="Entry type"><button type="button" data-action="entry-kind" data-kind="correction" aria-pressed="${editor.kind==='correction'}">Correction</button><button type="button" data-action="entry-kind" data-kind="term" aria-pressed="${editor.kind==='term'}">Reference term</button></div><div class="fields">${editor.kind==='correction'?`<label class="field">When recognized<input id="entry-hear" name="hear" value="${escape(editor.hear)}" required autocomplete="off"></label>`:''}<label class="field">${editor.kind==='correction'?'Replace with':'Word or phrase'}<input id="entry-write" name="write" value="${escape(editor.write)}" required autocomplete="off"></label></div><p class="validation" id="entry-validation" role="status" hidden></p><div class="form-actions"><button type="button" data-action="cancel-entry" class="subtle">Cancel</button><button type="submit" class="primary">Save entry</button></div></form>`;
    }
    function captureEditor() {
      if(!editor || !$('#entry-form')) return;
      if($('#entry-hear')) editor.hear=$('#entry-hear').value;
      editor.write=$('#entry-write').value;
    }
    function settingSwitch(key,label) { return `<div class="setting-row"><label for="setting-${key}">${label}</label><button id="setting-${key}" class="switch" role="switch" aria-label="${label}" aria-checked="${settings[key]}" data-action="toggle-setting" data-key="${key}"></button></div>`; }
    function renderSettings() {
      $('#content').innerHTML=`<div id="notice-host"></div><div class="page-heading"><h1>Settings</h1></div><p class="deferred" id="deferred-note" ${busy()?'':'hidden'}>Changes apply after this dictation.</p><section class="settings-group" aria-labelledby="dictation-heading"><h2 id="dictation-heading">Dictation</h2><div class="setting-row"><label for="shortcut">Push-to-talk key</label><select id="shortcut">${['Right Ctrl','Right Shift','Caps Lock','F13','Right Alt'].map(key=>`<option ${settings.shortcut===key?'selected':''}>${key}</option>`).join('')}</select></div><p class="validation" id="shortcut-warning" ${settings.shortcut==='Right Alt'?'':'hidden'}>Right Alt can interfere with AltGr characters.</p>${settingSwitch('inject','Insert text into the focused app')}${settingSwitch('history','Keep transcript history')}</section><section class="settings-group" aria-labelledby="application-heading"><h2 id="application-heading">Application</h2>${settingSwitch('startup','Start at Windows login')}<div class="setting-row"><label for="idle-timeout">Release model after</label><select id="idle-timeout">${['1','5','10','15','30','60'].map(value=>`<option value="${value}" ${settings.idle===value?'selected':''}>${value} ${value==='1'?'minute':'minutes'} idle</option>`).join('')}</select></div></section><details class="model-details"><summary>${icon('chevron')}Speech model<span class="model-state">Available</span></summary><div class="model-body"><div class="setting-row"><span>Model</span><span>Parakeet TDT v2</span></div><div class="setting-row"><span>Processing</span><span>On this device · CPU</span></div><button class="secondary" data-action="bundled-model">Use bundled model</button></div></details>`;
    }
    function searchClearVisibility() { const control=$('[data-action="clear-search"]'); if(control) control.hidden=!queries[view]; }
    function renderNotice() {
      if(!$('#notice-host')) return;
      $('#notice-host').innerHTML=notice?`<div class="notice" role="status">${icon('warning')}<div class="notice-content"><p>${escape(notice.text)}</p>${notice.transcript?`<p class="notice-transcript">${escape(notice.transcript)}</p>`:''}</div><div class="notice-actions">${notice.actions.map(([label,action])=>button(label,action)).join('')}</div></div>`:'';
    }
    function showToast(text,canUndo=false) {
      clearTimeout(toastTimer);
      $('#toast').innerHTML=`<span>${escape(text)}</span>${canUndo?button('Undo','undo'):''}`;
      $('#toast').hidden=false;
      toastTimer=setTimeout(()=>{ $('#toast').hidden=true; undo=null; },6500);
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); showToast('Copied'); }
      catch { showToast('Select the transcript and press Ctrl+C to copy.'); }
    }
    function selectRecord(id) {
      selected=id;
      document.querySelectorAll('[data-record]').forEach(row=>row.classList.toggle('selected',row.dataset.record===id));
    }
    function focusHistory(id) {
      (document.querySelector(`[data-record="${id}"]`)||document.querySelector('[data-record]')||$('#search-history'))?.focus();
    }
    function focusDictionary(id) {
      (document.querySelector(`[data-entry="${id}"] [data-action="edit-entry"]`)||$('[data-action="add-entry"]'))?.focus();
    }
    function showWindow(show) {
      if(!show&&view==='dictionary') captureEditor();
      $('#app-window').hidden=!show;
      $('.receiving').inert=show;
      $('#window-toggle').textContent=show?'Hide Freehand':'Show Freehand';
      if(show) render();
      announce(show?'Freehand window open':'Freehand is in the tray. The text field receives simulated dictation.');
    }
    function setState(next,pillLabel=null) {
      state=next;
      const status=labels[next];
      $('#demo-state').textContent=status;
      $('#pill').dataset.state=next;
      $('#pill').hidden=next==='ready';
      $('#pill-label').textContent=pillLabel||status;
      $('#pill-time').hidden=next!=='recording';
      $('#pill-actions').innerHTML=next==='awaiting-retry'?button('Open Freehand','show-window'):next==='insertion-failure'?button(icon('copy')+'Copy','copy-last'):'';
      const record=$('#record-button');
      record.innerHTML=icon(next==='recording'?'stop':'mic')+`<span>${next==='recording'?'Stop recording':busy()?'Processing':next==='awaiting-retry'?'Recording kept':'Start dictation'}</span>`;
      record.disabled=(busy()&&next!=='recording')||next==='awaiting-retry';
      $('#scenario').disabled=busy()||next==='awaiting-retry';
      $('#sample-text').disabled=busy()||next==='awaiting-retry';
      if($('#deferred-note')) $('#deferred-note').hidden=!busy();
      announce(pillLabel||status);
    }
    function startJob(retryCapture=false) {
      if(busy()||state==='awaiting-retry') return;
      serial++; clearTimeout(pillTimer); clearInterval(timer);
      pendingText=$('#sample-text').value; jobSettings={...settings};
      jobOutcome=retryCapture?'success':$('#scenario').value;
      notice=null; renderNotice();
      if(jobOutcome==='microphone-failure') {
        notice={text:'Microphone unavailable. Check your input device.',actions:[['Try again','retry-capture']]};
        setState('microphone-failure','Microphone unavailable'); renderNotice(); return;
      }
      started=Date.now(); $('#pill-time').textContent='00:00';
      setState('recording');
      timer=setInterval(()=>{
        const seconds=Math.floor((Date.now()-started)/1000);
        $('#pill-time').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
      },200);
    }
    function finishRecording() {
      if(state!=='recording') return;
      clearInterval(timer); setState('preparing');
      later(()=>{setState('transcribing'); later(()=>{
        if(jobOutcome==='transcription-failure') {
          setState('recovering');
          later(()=>{
            notice={text:"Couldn't transcribe this recording. Your recording is kept.",actions:[['Retry','retry'],['Discard','discard']]};
            setState('awaiting-retry','Recording kept'); renderNotice();
          },900);
        } else if(jobOutcome==='empty'||!pendingText.trim()) {
          setState('empty','No speech detected'); settlePill();
        } else deliver();
      },1200);},700);
    }
    function applyCorrections(text) {
      let output=text.normalize('NFC');
      const pairs=dictionary.filter(entry=>entry.enabled&&entry.kind==='correction').sort((a,b)=>b.hear.length-a.hear.length);
      if(!pairs.length) return output;
      const pattern=pairs.map(entry=>entry.hear.normalize('NFC').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
      const regex=new RegExp(`(?<![\\p{L}\\p{N}_])(?:${pattern})(?![\\p{L}\\p{N}_])`,'giu');
      return output.replace(regex,match=>pairs.find(entry=>entry.hear.normalize('NFC').toLowerCase()===match.toLowerCase())?.write||match);
    }
    function deliver() {
      lastResult=applyCorrections(pendingText);
      const complete=()=>{
        const failed=jobOutcome==='insertion-failure'&&jobSettings.inject;
        if(jobSettings.history) {
          const id=`h${nextId++}`;
          records.unshift({id,day:'Today',time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Chicago'}),text:lastResult});
          selected=id; if(view==='history') renderHistory();
        }
        if(failed) {
          notice={text:"Text couldn't be inserted. Your transcript is ready to copy.",transcript:lastResult,actions:[['Copy transcript','copy-last'],['Dismiss','dismiss-notice']]};
          setState('insertion-failure',"Couldn't insert text"); renderNotice();
        } else if(jobSettings.inject) {
          const target=$('#receiving-text'); target.value+=(target.value&&!target.value.endsWith('\n')?'\n':'')+lastResult;
          setState('success','Inserted'); settlePill();
        } else {
          notice={text:'Transcript ready.',transcript:lastResult,actions:[['Copy transcript','copy-last'],['Dismiss','dismiss-notice']]};
          setState('success','Transcript ready'); renderNotice(); settlePill();
        }
        pendingText='';
      };
      if(jobSettings.inject) { setState('inserting'); later(complete,550); } else complete();
    }
    function settlePill() { const token=serial; pillTimer=setTimeout(()=>{if(token===serial&&!busy()&&state!=='awaiting-retry') setState('ready');},2800); }
    function resetDemo(initial=false) {
      serial++; clearInterval(timer); clearTimeout(pillTimer); clearTimeout(toastTimer);
      records=structuredClone(seedHistory); dictionary=structuredClone(seedDictionary); settings={...defaultSettings};
      view='history'; selected='h1'; queries={history:'',dictionary:''}; visibleCount=3; editor=null; notice=null; undo=null; pendingText=''; lastResult='';
      $('#receiving-text').value=''; $('#scenario').value='success'; $('#sample-text').value='Use free hand to finish this note. Keep the next step simple.';
      $('#toast').hidden=true; $('.sample-input').open=false;
      setState('ready'); showWindow(true); if(!initial) showToast('Demo reset');
    }

    document.addEventListener('input',event=>{
      if(event.target.matches('[id^="search-"]')) { queries[view]=event.target.value; view==='history'?renderHistory():renderDictionary(); }
      if(event.target.closest('#entry-form')) $('#entry-validation').hidden=true;
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='shortcut') { settings.shortcut=event.target.value; $('#shortcut-warning').hidden=settings.shortcut!=='Right Alt'; showToast('Shortcut updated'); }
      if(event.target.id==='idle-timeout') { settings.idle=event.target.value; showToast('Idle timeout updated'); }
    });
    document.addEventListener('submit',event=>{
      if(event.target.id!=='entry-form') return;
      event.preventDefault(); captureEditor();
      const draft={...editor,hear:editor.hear.trim(),write:editor.write.trim()};
      if(!draft.write||(draft.kind==='correction'&&!draft.hear)) return;
      if(draft.kind==='correction'&&dictionary.some(entry=>entry.id!==draft.id&&entry.kind==='correction'&&entry.hear.toLowerCase()===draft.hear.toLowerCase())) {
        $('#entry-validation').textContent='A correction already uses this recognized phrase.'; $('#entry-validation').hidden=false; return;
      }
      if(draft.id) dictionary[dictionary.findIndex(entry=>entry.id===draft.id)]=draft;
      else dictionary.push({...draft,id:`d${nextId++}`,enabled:true});
      editor=null; renderEditor(); renderDictionary(); $('[data-action="add-entry"]').focus(); showToast('Entry saved');
    });
    document.addEventListener('focusin',event=>{ const row=event.target.closest('[data-record]'); if(row) selectRecord(row.dataset.record); });
    document.addEventListener('keydown',event=>{
      if(event.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
        event.preventDefault(); const tabs=[...document.querySelectorAll('[data-view]')]; let index=tabs.indexOf(event.target);
        index=event.key==='Home'?0:event.key==='End'?2:(index+(event.key==='ArrowRight'?1:2))%3;
        if(view==='dictionary') captureEditor();
        view=tabs[index].dataset.view; render(); tabs[index].focus();
      }
      if(event.key==='Escape') { document.querySelectorAll('details[open]').forEach(detail=>detail.open=false); if(editor){editor=null;renderEditor();$('[data-action="add-entry"]')?.focus();} }
    });
    document.addEventListener('click',event=>{
      document.querySelectorAll('.row-menu[open]').forEach(menu=>{if(!menu.contains(event.target)) menu.open=false;});
      const row=event.target.closest('[data-record]'); if(row) selectRecord(row.dataset.record);
      const tab=event.target.closest('[data-view]');
      if(tab) { if(view==='dictionary') captureEditor(); view=tab.dataset.view; render(); return; }
      const control=event.target.closest('[data-action]'); if(!control||control.disabled) return;
      const id=control.dataset.id;
      switch(control.dataset.action) {
        case 'copy': copyText(records.find(record=>record.id===id).text); break;
        case 'copy-last': if(lastResult) copyText(lastResult); break;
        case 'delete-record': {
          const visible=[...document.querySelectorAll('[data-record]')]; const position=visible.findIndex(row=>row.dataset.record===id);
          const neighbor=(visible[position+1]||visible[position-1])?.dataset.record;
          const index=records.findIndex(record=>record.id===id); undo={kind:'history',item:records[index],index}; records.splice(index,1); renderHistory(); focusHistory(neighbor); showToast('Transcript deleted',true); break;
        }
        case 'load-more': { const previousCount=document.querySelectorAll('[data-record]').length; visibleCount+=3; renderHistory(); const added=document.querySelectorAll('[data-record]')[previousCount]; focusHistory(added?.dataset.record); break; }
        case 'clear-search': queries[view]=''; $(`#search-${view}`).value=''; view==='history'?renderHistory():renderDictionary(); $(`#search-${view}`).focus(); break;
        case 'add-entry': editor={kind:'correction',hear:'',write:'',enabled:true}; renderEditor(); $('#entry-hear').focus(); break;
        case 'edit-entry': editor={...dictionary.find(entry=>entry.id===id)}; renderEditor(); ($('#entry-hear')||$('#entry-write')).focus(); break;
        case 'cancel-entry': editor=null; renderEditor(); $('[data-action="add-entry"]').focus(); break;
        case 'entry-kind': captureEditor(); editor.kind=control.dataset.kind; renderEditor(); ($('#entry-hear')||$('#entry-write')).focus(); break;
        case 'toggle-entry': {
          const entry=dictionary.find(entry=>entry.id===id); entry.enabled=!entry.enabled; control.setAttribute('aria-checked',entry.enabled); control.closest('.dict-row').classList.toggle('disabled',!entry.enabled); announce(`${entry.hear||entry.write} ${entry.enabled?'enabled':'disabled'}`); break;
        }
        case 'delete-entry': {
          const visible=[...document.querySelectorAll('[data-entry]')]; const position=visible.findIndex(row=>row.dataset.entry===id);
          const neighbor=(visible[position+1]||visible[position-1])?.dataset.entry;
          const index=dictionary.findIndex(entry=>entry.id===id); undo={kind:'dictionary',item:dictionary[index],index}; dictionary.splice(index,1); if(editor?.id===id){editor=null;renderEditor();} renderDictionary(); focusDictionary(neighbor); showToast('Entry deleted',true); break;
        }
        case 'undo': if(undo) { const restored=undo; const list=restored.kind==='history'?records:dictionary; list.splice(restored.index,0,restored.item); undo=null; if(view==='history'){renderHistory();focusHistory(restored.item.id);} else if(view==='dictionary'){renderDictionary();focusDictionary(restored.item.id);} else $(`#tab-${view}`).focus(); showToast('Restored'); } break;
        case 'toggle-setting': settings[control.dataset.key]=!settings[control.dataset.key]; control.setAttribute('aria-checked',settings[control.dataset.key]); announce('Setting updated'); break;
        case 'bundled-model': showToast('Bundled model selected'); break;
        case 'record': if(state==='recording') finishRecording(); else startJob(); break;
        case 'retry': if(state==='awaiting-retry') { notice=null; renderNotice(); jobOutcome='success'; setState('recovering'); later(()=>{setState('transcribing');later(deliver,1000);},650); } break;
        case 'discard': if(state==='awaiting-retry') { serial++; pendingText='';notice=null;renderNotice();setState('ready');showToast('Recording discarded'); } break;
        case 'retry-capture': startJob(true); break;
        case 'dismiss-notice': notice=null;renderNotice();if(!busy())setState('ready'); break;
        case 'hide-window': showWindow(false); break;
        case 'show-window': showWindow(true); break;
        case 'toggle-window': showWindow($('#app-window').hidden); break;
        case 'expand': { const expanded=$('#workspace').classList.toggle('expanded'); control.setAttribute('aria-pressed',expanded); control.setAttribute('aria-label',expanded?'Restore window':'Expand window'); break; }
        case 'clear-target': $('#receiving-text').value=''; break;
        case 'reset': resetDemo(); break;
      }
    });
    new ResizeObserver(entries=>document.documentElement.style.setProperty('--dock-height',`${entries[0].target.offsetHeight}px`)).observe($('.demo-dock'));
    resetDemo(true);
  </script>
</body>
</html>
